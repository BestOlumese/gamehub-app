packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

# Shared versions, pinned exactly. Reference with "catalog:" in package.json.
catalog:
  eslint: 9.39.5
  typescript: 6.0.3
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11
  zod: 4.6.5
  "@types/node": 24.19.1
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

minimumReleaseAgeExclude:
  - lucide-react@1.52.0
