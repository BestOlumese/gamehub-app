name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget
        run: pnpm budget
      - name: Lighthouse (mobile, median of 3)
        run: pnpm exec lhci autorun

  # Auth flows end to end against `next start`, local Postgres and Mailpit (docs/12-testing.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gamehub
          POSTGRES_PASSWORD: gamehub
          POSTGRES_DB: gamehub
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gamehub" --health-interval 2s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://gamehub:gamehub@localhost:5433/gamehub
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SMTP_URL: smtp://localhost:1025
      E2E_DISABLE_RATE_LIMIT: "1"
      # Realtime: wrangler dev on :8787 with throwaway secrets shared by web and the Worker.
      REALTIME_TICKET_SECRET: ci-only-ticket-secret-0123456789abcdef0123
      INTERNAL_HMAC_SECRET: ci-only-hmac-secret-0123456789abcdef012345
      REALTIME_URL: http://localhost:8787
      NEXT_PUBLIC_REALTIME_HOST: localhost:8787
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter db migrate
      - name: Worker dev secrets
        run: |
          printf 'REALTIME_TICKET_SECRET=%s\nINTERNAL_HMAC_SECRET=%s\nCHAT_SIGN_SECRET=ci-chat\n' \
            "$REALTIME_TICKET_SECRET" "$INTERNAL_HMAC_SECRET" > apps/realtime/.dev.vars
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # Realtime Worker preview for PRs: a versioned upload with its own preview URL.
  realtime-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter realtime exec wrangler versions upload --preview-alias pr-${{ github.event.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # main only, after checks pass: migrate Neon, then deploy the Worker.
  # The web app deploys through Vercel's Git integration (previews on every PR).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate database
        run: pnpm --filter db migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy realtime Worker
        run: pnpm --filter realtime run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
